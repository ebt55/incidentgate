services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: triage_lab
      POSTGRES_USER: triage_lab
      POSTGRES_PASSWORD: ${TRIAGE_LAB_POSTGRES_PASSWORD:-triage_lab_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage_lab -d triage_lab"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - triage_lab_postgres:/var/lib/postgresql/data
  d1-lab:
    build:
      context: .
      dockerfile: docker/Dockerfile.d1-lab
    environment:
      DATABASE_URL: postgresql://triage_lab:${TRIAGE_LAB_POSTGRES_PASSWORD:-triage_lab_dev_only}@postgres:5432/triage_lab
      D1_LAB_ADMIN_TOKEN: ${D1_LAB_ADMIN_TOKEN:-d1-local-admin}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
  d1-approval-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.d1-lab
    command: ["uv", "run", "--no-sync", "uvicorn", "triage_agent_lab.host.server:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      DATABASE_URL: postgresql://triage_lab:${TRIAGE_LAB_POSTGRES_PASSWORD:-triage_lab_dev_only}@postgres:5432/triage_lab
      D1_UI_BIND_HOST: 127.0.0.1
      D1_UI_PORT: 8090
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      ADVISORY_MONITOR_PROVIDER: ${ADVISORY_MONITOR_PROVIDER:-fixture}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  triage_lab_postgres:
