[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "incidentgate"
version = "0.1.0"
description = "A contract-first, approval-gated incident-response reliability lab."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13.4,<2.14"]

[project.optional-dependencies]
runtime = [
  "anthropic>=0.40,<1",
  "fastapi>=0.139.2,<0.140",
  "langfuse>=3,<4",
  "langgraph>=1.2.9,<1.3",
  "langgraph-checkpoint-postgres>=3,<4",
  "mcp>=1.27,<2",
  "openai>=2.53,<3",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "psycopg[binary,pool]>=3.2,<4",
]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/incidentgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests requiring live external services"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".uv-cache", ".venv"]

[tool.ruff.lint]
# extend-select, not select: the default rule set already in force here is broad
# (it includes I, B, S, BLE and more -- the six existing `# noqa: BLE001` comments
# depend on it). Replacing it with an explicit select would silently switch most of
# that off. This only adds the one rule that was missing: line-length, which
# line-length = 100 above had been configuring for a formatter that never ran.
extend-select = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
